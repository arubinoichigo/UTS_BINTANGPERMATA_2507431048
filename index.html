<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTS WEB LOGIN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div class="container">
         <div class="image-section">
        </div>
        <div class="form-section">
            <h2>Selamat Datang!</h2>
            <p>Silakan masukkan akun Anda untuk lanjut.</p>

            <form>
                <label>Email / Username</label>
                <input type="text" placeholder="Masukkan email/username...">

                <label>Password</label>
                <input type="password" placeholder="Masukkan password...">

                <div class="baris-bawah">
                 <label class="checkbox-label">
                 <input type="checkbox" name="remember"> Remember Me
                 </label>
    
                 <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button class="but1" type="submit">Sign In</button>
                <button class="but2" type="submit">Sign in with SSO</button>
            </form>
        </div>

    </div>

</body>
</html>
